<!DOCTYPE html>
<html>
<head>
    <title>Manage Orders</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .delete-btn {
            background-color: red;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
        }

        .delete-btn:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

    <h2>Manage Products</h2>

    <table>
        <tr>
            <th>Product ID</th>
            <th>Product name</th>
            
            <th>Price</th>
            <th>Category ID</th>
            <th>Seller ID</th>
            <th>To delete</th>
            
            
        </tr>

        {% for product in products %}
        <tr>
                <td>{{ product.product_id }}</td>
                <td>{{ product.product_name }}</td>
                <td>{{ product.price }}</td>
                <td>{{ product.category_id }}</td>
                <td>{{ product.pdc_seller_id }}</td>
            <td>
                <a class="delete-btn"
                   href="/admin/delete-product/{{ product.product_id }}"
                   onclick="return confirm('Are you sure you want to delete this Product?')">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
