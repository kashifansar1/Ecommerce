<!DOCTYPE html>
<html>
<head>
    <title>Seller Dashboard</title>

    <style>

        body{
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .navbar{
            background-color: black;
            padding: 15px;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-size: 18px;
        }

        .container{
            padding: 20px;
        }

        .cards{
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .card{
            background-color: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px gray;
            text-align: center;
        }

        .card h2{
            margin: 0;
            font-size: 35px;
        }

        .card p{
            font-size: 18px;
        }

        .buttons{
            margin-top: 40px;
        }

        .buttons a{
            background-color: black;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            margin-right: 10px;
            border-radius: 5px;
        }

        .recent{
            margin-top: 50px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 5px gray;
        }

    </style>

</head>
<body>

    <div class="navbar">

        <a href="/seller/dashboard">Dashboard</a>

     
        <a href="/logout">Logout</a>

    </div>

    <div class="container">

        <h1>Welcome Seller {{ session['user'] }}</h1>

        <!-- Summary Cards -->

        <div class="cards">

            <div class="card">
                <h2>{{total_products}}</h2>
                <p>Total Products</p>
            </div>

            <div class="card">
                <h2>{{total_orders}}</h2>
                <p>Total Orders</p>
            </div>

            <div class="card">
                <h2>{{total_stock}}</h2>
                <p>Total Stocks</p>
            </div>


        </div>

        <!-- Quick Buttons -->

        <div class="buttons">

            <a href="/seller/seller-product">Manage Products</a>

            <a href="/seller/manage-orders">Manage Orders</a>


        </div>

        <!-- Recent Activity -->

        <div class="recent">

            <h2>Recent Activity</h2>

            <p>• New order received</p>


            <p>• Product stock updated</p>

        </div>

    </div>

</body>
</html>
